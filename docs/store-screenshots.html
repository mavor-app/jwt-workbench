<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JWT Workbench — Store screenshot frames</title>
    <style>
      :root {
        --bg: #0e0e16;
        --panel-1: #14131f;
        --panel-2: #0c0c14;
        --fg: #f6f6f9;
        --muted: #9a9ab0;
        --rose: #fb7185;
        --violet: #a78bfa;
        --cyan: #22d3ee;
        --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        background: #1b1b22;
        color: var(--fg);
        font-family: var(--font);
        -webkit-font-smoothing: antialiased;
        padding: 40px 0 80px;
      }

      /* --- Screen-only helper UI (hidden while capturing) --- */
      .toolbar {
        position: fixed;
        top: 0; left: 0; right: 0;
        z-index: 100;
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 10px 20px;
        background: rgba(20, 20, 28, 0.9);
        backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        font-size: 13px;
      }
      .toolbar b { color: var(--violet); }
      .toolbar .hint { color: var(--muted); }
      .toolbar button {
        font-family: var(--font);
        font-size: 13px;
        color: var(--fg);
        background: var(--violet);
        border: 0;
        border-radius: 8px;
        padding: 7px 14px;
        cursor: pointer;
      }
      .toolbar button.secondary { background: rgba(255,255,255,0.1); }
      body.clean .toolbar { display: none; }
      body.clean { padding-top: 0; }

      .stage { display: flex; flex-direction: column; align-items: center; gap: 48px; margin-top: 56px; }
      body.clean .stage { margin-top: 0; gap: 0; }

      .wrap { position: relative; }
      .cap {
        position: absolute;
        top: -26px; left: 6px;
        font-size: 12px;
        color: var(--muted);
      }
      body.clean .cap { display: none; }

      /* --- The exported panel: exactly 1280x800 --- */
      .panel {
        width: 1280px;
        height: 800px;
        position: relative;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        background: radial-gradient(120% 90% at 50% -10%, var(--panel-1) 0%, var(--panel-2) 60%, #08080e 100%);
      }
      .panel::before {
        /* soft accent glow behind the device */
        content: "";
        position: absolute;
        left: 50%;
        top: 340px;
        width: 760px;
        height: 620px;
        transform: translateX(-50%);
        background: radial-gradient(closest-side, var(--accent) 0%, transparent 70%);
        opacity: 0.16;
        filter: blur(10px);
      }
      .panel::after {
        /* subtle top hairline */
        content: "";
        position: absolute;
        inset: 0;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
        pointer-events: none;
      }

      .head {
        position: relative;
        z-index: 2;
        text-align: center;
        padding: 68px 96px 0;
        max-width: 1080px;
      }
      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--accent);
      }
      .eyebrow .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
      h2 {
        margin-top: 16px;
        font-size: 46px;
        line-height: 1.1;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      .sub {
        margin: 16px auto 0;
        font-size: 20px;
        line-height: 1.5;
        color: var(--muted);
        max-width: 760px;
      }

      /* --- Device / window frame that holds the user's screenshot --- */
      .device {
        position: relative;
        z-index: 2;
        margin-top: 40px;
        width: 340px;
        height: 560px;
        border-radius: 22px;
        background: #05050a;
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 40px 90px -20px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.03);
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      .titlebar {
        height: 34px;
        flex: 0 0 34px;
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 0 13px;
        background: #101018;
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      }
      .titlebar i { width: 11px; height: 11px; border-radius: 50%; display: inline-block; }
      .titlebar .r { background: #ff5f57; }
      .titlebar .y { background: #febc2e; }
      .titlebar .g { background: #28c840; }
      .titlebar span { margin-left: auto; margin-right: auto; font-size: 11px; color: #6f6f85; transform: translateX(-14px); }

      .shot {
        flex: 1;
        position: relative;
        background:
          linear-gradient(135deg, rgba(167,139,250,0.06), rgba(34,211,238,0.06)),
          repeating-linear-gradient(45deg, #0c0c14 0 12px, #101019 12px 24px);
      }
      .shot img { width: 100%; height: 100%; object-fit: cover; object-position: top center; display: none; }
      .shot.filled img { display: block; }
      .placeholder {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        color: #6f6f85;
        font-size: 13px;
        text-align: center;
        padding: 20px;
      }
      .shot.filled .placeholder { display: none; }
      .placeholder .big { font-size: 30px; opacity: 0.5; }
      .placeholder button {
        font-family: var(--font);
        font-size: 12px;
        color: var(--fg);
        background: rgba(255,255,255,0.12);
        border: 1px solid rgba(255,255,255,0.15);
        border-radius: 7px;
        padding: 6px 12px;
        cursor: pointer;
      }

      /* re-upload affordance shown on hover, hidden when clean */
      .reupload {
        position: absolute;
        top: 42px; right: 10px;
        z-index: 5;
        font-size: 11px;
        color: var(--fg);
        background: rgba(0,0,0,0.55);
        border: 1px solid rgba(255,255,255,0.2);
        border-radius: 6px;
        padding: 4px 8px;
        cursor: pointer;
        display: none;
      }
      .wrap:hover .shot.filled ~ .reupload { display: block; }
      body.clean .reupload { display: none !important; }

      .brand {
        position: absolute;
        bottom: 30px; left: 0; right: 0;
        z-index: 2;
        text-align: center;
        font-size: 14px;
        color: var(--muted);
      }
      .brand b { color: var(--fg); font-weight: 600; }
    </style>
  </head>
  <body>
    <div class="toolbar">
      <b>JWT Workbench — store screenshot frames</b>
      <span class="hint">Drop your side-panel screenshot into each panel · each panel is exactly 1280×800 · then capture it.</span>
      <button id="toggle">Hide controls for capture</button>
      <span class="hint">Tip: capture with a region screenshot at 1280×800, or use DevTools “Capture node screenshot”.</span>
    </div>

    <div class="stage" id="stage"></div>

    <script>
      const PANELS = [
        {
          accent: 'var(--violet)',
          eyebrow: 'Encode',
          title: 'Sign JWTs in real time',
          sub: 'Edit the header and payload as JSON, pick your algorithm, and watch the signed token update instantly — then copy it in one click.',
        },
        {
          accent: 'var(--cyan)',
          eyebrow: 'Decode',
          title: 'Decode any token in one click',
          sub: 'Pull a JWT straight from your clipboard and read a color-highlighted header and payload, with readable timestamps and signature verification.',
        },
        {
          accent: 'var(--rose)',
          eyebrow: 'Projects',
          title: 'Save reusable token setups',
          sub: 'Store a header, payload, and secret as a named project. Reopen it anytime, tweak the payload, and grab a fresh token.',
        },
        {
          accent: 'var(--violet)',
          eyebrow: 'Secrets',
          title: 'A library of named secrets',
          sub: 'Keep your signing keys with friendly names and reuse them across projects — in both the encoder and the decoder.',
        },
        {
          accent: 'var(--cyan)',
          eyebrow: 'Productivity',
          title: 'Set expiration in one tap',
          sub: 'Drop a correct exp claim into your payload with presets from 5 minutes to 1 year. No more hand-computing timestamps.',
        },
      ];

      const stage = document.getElementById('stage');

      PANELS.forEach((p, idx) => {
        const wrap = document.createElement('div');
        wrap.className = 'wrap';

        const cap = document.createElement('div');
        cap.className = 'cap';
        cap.textContent = `Panel ${idx + 1} / ${PANELS.length} — 1280×800`;
        wrap.appendChild(cap);

        const panel = document.createElement('div');
        panel.className = 'panel';
        panel.style.setProperty('--accent', p.accent);
        panel.innerHTML = `
          <div class="head">
            <div class="eyebrow"><span class="dot"></span>${p.eyebrow}</div>
            <h2>${p.title}</h2>
            <p class="sub">${p.sub}</p>
          </div>
          <div class="device">
            <div class="titlebar"><i class="r"></i><i class="y"></i><i class="g"></i><span>JWT Workbench</span></div>
            <div class="shot" id="shot-${idx}">
              <img alt="" />
              <div class="placeholder">
                <div class="big">＋</div>
                <div>Drop your side-panel screenshot here<br />or</div>
                <button type="button">Choose image…</button>
              </div>
            </div>
          </div>
          <button class="reupload" type="button">Replace image</button>
          <div class="brand"><b>JWT Workbench</b> · Encode · Decode · Manage — all local</div>
        `;
        wrap.appendChild(panel);
        stage.appendChild(wrap);

        const shot = panel.querySelector('.shot');
        const img = shot.querySelector('img');
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = 'image/*';
        input.style.display = 'none';
        wrap.appendChild(input);

        const load = (file) => {
          if (!file) return;
          const reader = new FileReader();
          reader.onload = (e) => {
            img.src = e.target.result;
            shot.classList.add('filled');
          };
          reader.readAsDataURL(file);
        };

        panel.querySelector('.placeholder button').addEventListener('click', () => input.click());
        panel.querySelector('.reupload').addEventListener('click', () => input.click());
        input.addEventListener('change', () => load(input.files[0]));

        // drag & drop
        shot.addEventListener('dragover', (e) => { e.preventDefault(); shot.style.outline = '2px dashed var(--accent)'; });
        shot.addEventListener('dragleave', () => { shot.style.outline = ''; });
        shot.addEventListener('drop', (e) => {
          e.preventDefault();
          shot.style.outline = '';
          load(e.dataTransfer.files[0]);
        });
      });

      document.getElementById('toggle').addEventListener('click', (e) => {
        document.body.classList.toggle('clean');
        e.target.textContent = document.body.classList.contains('clean')
          ? 'Show controls'
          : 'Hide controls for capture';
      });
    </script>
  </body>
</html>
